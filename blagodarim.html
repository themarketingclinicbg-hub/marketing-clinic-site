<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <title>Благодарим! | Marketing Clinic</title>
  <meta name="theme-color" content="#1E3A2F">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>if (typeof fbq !== "undefined") { fbq("track", "Lead"); }</script>
  <style>
    .ty-page { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:clamp(100px,14vw,160px) clamp(24px,5vw,80px) clamp(72px,8vw,120px); }
    .ty-tag  { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:rgba(30,58,47,0.55); margin-bottom:16px; font-family:"DM Sans",sans-serif; display:block; }
    .ty-h1   { font-family:"Cormorant Garamond",serif; font-size:clamp(42px,6vw,72px); font-weight:600; line-height:1.05; letter-spacing:-.02em; color:#1E3A2F; margin-bottom:20px; }
    .ty-h1 em{ font-style:italic; color:rgba(30,58,47,0.38); }
    .ty-p    { font-size:15px; line-height:1.8; color:rgba(30,58,47,0.65); max-width:400px; margin:0 auto 40px; }
    .ty-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    .ty-divider { width:40px; height:1px; background:rgba(30,58,47,0.18); margin:52px auto; }
    .ty-next { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(30,58,47,0.4); margin-bottom:28px; font-family:"DM Sans",sans-serif; }
    .ty-steps { display:flex; gap:40px; flex-wrap:wrap; justify-content:center; }
    .ty-step  { text-align:center; max-width:140px; }
    .ty-step-n{ font-family:"Cormorant Garamond",serif; font-size:32px; font-weight:600; color:#1E3A2F; opacity:.18; line-height:1; }
    .ty-step-t{ font-size:12px; line-height:1.6; color:rgba(30,58,47,0.6); margin-top:8px; font-family:"DM Sans",sans-serif; }
    @media(max-width:600px){ .ty-steps{gap:24px} .ty-step{max-width:120px} }
  </style>
</head>
<body>
  <header style="position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 40px;background:rgba(245,240,232,0.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;">
    <a href="/" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1E3A2F;">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" width="32" height="32">
        <circle cx="15" cy="15" r="11" stroke="#1E3A2F" stroke-width="2.4" fill="none"/>
        <line x1="23" y1="23" x2="33" y2="33" stroke="#1E3A2F" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="7" y="19" width="3" height="3" fill="#1E3A2F" rx="0.5"/>
        <rect x="11" y="15" width="3" height="7" fill="#1E3A2F" rx="0.5"/>
        <rect x="15" y="12" width="3" height="10" fill="#1E3A2F" rx="0.5"/>
        <rect x="19" y="9" width="3" height="13" fill="#1E3A2F" rx="0.5"/>
      </svg>
      <span style="font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;line-height:1.1;color:#1E3A2F;">Marketing<br>Clinic</span>
    </a>
  </header>

<div class="ty-page">
  <span class="ty-tag">The Marketing Clinic</span>
  <h1 class="ty-h1">Получихме<br><em>запитването</em><br>ти.</h1>
  <p class="ty-p">Ще се свържем с теб до <strong>24 часа.</strong> Провери и имейла си.</p>
  <div class="ty-actions">
    <a href="/" class="btn">← Обратно към началото</a>
    <a href="https://www.facebook.com/profile.php?id=61579207195363" target="_blank" rel="noopener" class="btn-outline">Facebook</a>
  </div>
  <div class="ty-divider"></div>
  <p class="ty-next">Какво следва</p>
  <div class="ty-steps">
    <div class="ty-step"><div class="ty-step-n">01</div><p class="ty-step-t">Имейл потвърждение</p></div>
    <div class="ty-step"><div class="ty-step-n">02</div><p class="ty-step-t">Свързваме се до 24 часа</p></div>
    <div class="ty-step"><div class="ty-step-n">03</div><p class="ty-step-t">Безплатна консултация</p></div>
    <div class="ty-step"><div class="ty-step-n">04</div><p class="ty-step-t">Конкретна оферта</p></div>
  </div>
</div>
</body>
</html>
